name: Encrypted DB Backup

# Free replacement for Supabase's paid backup tier.
# Dumps the database daily, encrypts it, and stores it as a build artifact.
#
# ENCRYPTION IS NOT OPTIONAL: this repository is public, and GitHub Actions
# artifacts on a public repo are downloadable by anyone. An unencrypted dump
# would publish every health report, reporter identity and GPS coordinate.
#
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL    — Supabase → Connect → "Session pooler" connection string
#                        (the IPv4-capable one; GitHub runners cannot reach the
#                        IPv6-only direct host)
#   BACKUP_PASSPHRASE  — any long random phrase. WITHOUT IT THE BACKUPS ARE
#                        UNRECOVERABLE. Store it somewhere outside this repo.

on:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC daily (~07:47 IST)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check that secrets are configured
        id: guard
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::warning::SUPABASE_DB_URL and/or BACKUP_PASSPHRASE not set — skipping backup."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PostgreSQL 17 client
        if: steps.guard.outputs.ready == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          # The runner ships client 16 and Debian's pg_wrapper keeps resolving
          # /usr/bin/pg_dump to it; pg_dump refuses to dump a newer server
          # ("aborting because of server version mismatch"). Put 17 first.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump and encrypt
        if: steps.guard.outputs.ready == 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          # Pasting into GitHub's secret textarea commonly captures a trailing
          # newline; it ends up inside the value and Postgres then looks for a
          # database literally named "postgres\n". Strip CR/LF from both.
          DB_URL="$(printf '%s' "$DB_URL" | tr -d '\r\n')"
          PASSPHRASE="$(printf '%s' "$PASSPHRASE" | tr -d '\r\n')"
          STAMP=$(date -u +%Y%m%d-%H%M)

          # public = the surveillance data; this one must succeed.
          # Custom format (-Fc) is compressed and restores selectively.
          pg_dump "$DB_URL" --no-owner --no-privileges \
            --schema=public -Fc -f "healthdrop-public-$STAMP.dump"

          # auth = accounts. Best-effort: the pooler role does not always hold
          # rights on every object supabase_auth_admin owns, and losing the
          # surveillance backup over that would be the worse outcome. Accounts
          # can be re-created; six months of field reports cannot.
          if pg_dump "$DB_URL" --no-owner --no-privileges \
               --schema=auth -Fc -f "healthdrop-auth-$STAMP.dump" 2> auth-dump.err; then
            echo "auth schema dumped"
          else
            echo "::warning::auth schema dump failed (permissions) — public data still backed up."
            sed 's/^/  /' auth-dump.err | head -5
            rm -f "healthdrop-auth-$STAMP.dump"
          fi

          for f in healthdrop-*-"$STAMP".dump; do
            gpg --batch --yes --symmetric --cipher-algo AES256 \
              --passphrase "$PASSPHRASE" -o "$f.gpg" "$f"
            rm -f "$f"
          done
          ls -lh healthdrop-*.dump.gpg
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

      - name: Upload encrypted backup
        if: steps.guard.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: healthdrop-db-${{ env.STAMP }}
          path: healthdrop-*.dump.gpg
          retention-days: 30
          if-no-files-found: error
