name: Build APK on Push

# Every push to main builds an APK on EAS and publishes it as a GitHub
# Release with auto-generated notes. Skip by including [skip build] in the
# commit message. Superseded queued runs are cancelled to save EAS credits.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "database_structure/**"
      - "mesc/**"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

# Skip-marked runs get their own group (run_id) so a docs push with
# [skip build] can never cancel an in-flight APK build — the job would
# self-skip anyway, but entering the shared group cancels first.
concurrency:
  group: ${{ contains(github.event.head_commit.message, '[skip build]') && github.run_id || 'eas-build-main' }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip build]')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Verification gate ────────────────────────────────────────────
      # Everything below runs BEFORE the EAS build, so a broken commit fails
      # in ~5 minutes of free runner time instead of burning an EAS build and
      # shipping an APK. Each step is individually cheap; together they cover
      # the three ways this project has actually broken.

      # 1. A near-black light-mode headerBg once shipped with ~1.5:1 header
      #    text because nothing checked colour pairs.
      - name: Check token contrast
        run: node scripts/check-contrast.cjs

      # 2. Types. Cheap, and catches the renames that silently produce
      #    undefined at runtime.
      - name: Typecheck
        run: npx tsc --noEmit

      # 3. Database invariants: grants, RLS policies, and scheduled-job
      #    health. The escalation cron failed 961 times without anyone
      #    noticing, and several "verified by reading" security claims turned
      #    out to be false. Read-only. Skips (exit 0) without the secret, so
      #    a fork is never a red build.
      - name: Check database invariants
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/check-db.cjs

      # 4. The role tour: log in as every role and walk the UI. This app once
      #    shipped an unreadable header because the only visual check anyone
      #    ran was a screenshot of the SIGN-IN screen — nobody logged in.
      #    --quick is 4 sessions across both widths, themes and languages;
      #    the full 24-session matrix is for local runs and release branches.
      #    Skips (exit 0) without credentials, and says so out loud.
      - name: Install Chromium for the role tour
        run: npx playwright install --with-deps chromium

      - name: Build web bundle for the role tour
        run: npx expo export --platform web

      - name: Role tour (all roles, both themes, both widths)
        env:
          HEALTHDROP_E2E_ACCOUNTS: ${{ secrets.HEALTHDROP_E2E_ACCOUNTS }}
        run: node e2e/run.cjs --quick

      - name: Upload role-tour evidence
        # Screenshots and the machine-readable report, kept even when the
        # tour fails — that is precisely when they are worth reading.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: role-tour-${{ github.run_id }}
          path: |
            e2e/report.json
            e2e/shots/
          retention-days: 14
          if-no-files-found: ignore

      - name: Compute version
        id: version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          # versionCode must be strictly increasing across ALL builds or
          # Android refuses to update. Commit count is monotonic per push,
          # unlike per-workflow run numbers which reset between workflows.
          BUILD_NUM=$(git rev-list --count HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "buildnum=$BUILD_NUM" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-build.${BUILD_NUM}" >> "$GITHUB_OUTPUT"

      - name: Sync versionCode for this build
        run: node scripts/sync-version.cjs "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.buildnum }}"

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK on EAS
        # 'eas' comes from expo-github-action's PATH — 'npx eas' resolves the
        # wrong registry package and fails with "could not determine executable".
        run: eas build --platform android --profile preview --non-interactive --wait --json > eas-build.json

      - name: Download APK artifact
        run: |
          APK_URL=$(node -e "const fs=require('fs');const raw=JSON.parse(fs.readFileSync('eas-build.json','utf8'));const item=Array.isArray(raw)?raw[0]:raw;const url=item?.artifacts?.buildUrl||'';if(!url){process.exit(1)};process.stdout.write(url);")
          curl -L "$APK_URL" -o "HealthDrop-${{ steps.version.outputs.tag }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: HealthDrop ${{ steps.version.outputs.version }} (build ${{ steps.version.outputs.buildnum }})
          generate_release_notes: true
          make_latest: true
          files: |
            HealthDrop-*.apk
